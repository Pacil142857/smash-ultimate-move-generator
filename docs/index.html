<!DOCTYPE html>
<style>
    body {
        font-family: sans-serif;
        text-align: center;
        font-size: xxx-large;
    }
    #generate-button {
        width: 250px;
        height: 100px;
        font-size: xx-large;
    }
    .point-button {
        width: 150px;
        height: 50px;
        font-size: large;
    }
</style>

<head>
    <title>Smash Ultimate Random Move Generator</title>
</head>

<body>
    <div>
        <span>Character: </span><span id="character">Mario</span>
    </div>

    <div>
        <span>Move: </span><span id="move">Jab</span>
    </div> <br>

    <script defer charset="utf-8" src="move_generator.js"></script>
    <button type="button" id="generate-button" onclick="generateMoves()">Generate Move</button>
    <br><br>

    <div style="font-size: smaller">
        Points: <span id="point-counter">0</span><br>
        <button type="button" class="point-button" id="add-button">Add Point</button> <br>
        <button type="button" class="point-button" id="remove-button">Remove Point</button>
    </div>
    <script>
        const addButton = document.getElementById("add-button");
        const removeButton = document.getElementById("remove-button");
        const counter = document.getElementById("point-counter");
        addButton.addEventListener("click", () => counter.innerHTML++);
        removeButton.addEventListener("click", () => counter.innerHTML--);
    </script>
</body>
